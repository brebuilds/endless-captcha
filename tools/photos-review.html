<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Review Sheet</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)); font: 13px/1.4 -apple-system, Arial, sans-serif; background: #f3f4f6; color: #1c2024; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #555; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #ddd; padding: 10px; }
  .card h2 { font-size: 13px; margin: 0 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  figure { margin: 0; position: relative; }
  figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  figcaption { font-size: 10px; color: #444; padding: 2px 0 4px; overflow-wrap: anywhere; }
  figcaption code { color: #999; }
  .drawn { outline: 2px solid #d97706; }
</style>
</head>
<body>
<h1>Photo review sheet</h1>
<p>Every challenge grid with its real photos, before the grain. Orange outline = no photo yet (drawn fallback). To reject a photo, add its id to <code>tools/photo-overrides.json</code> → <code>exclude</code> and rerun <code>node tools/fetch-photos.mjs</code>.</p>
<div class="sheet" id="sheet"></div>
<script src="/assets/content.js"></script>
<script src="/assets/photos.js"></script>
<script src="/assets/tiles.js"></script>
<script>
  fetch("/assets/photos/credits.json").then((r) => r.json()).catch(() => []).then((credits) => {
    const byFile = Object.fromEntries(credits.map((c) => [c.file, c]));
    const { CHALLENGES } = window.CX_CONTENT;
    const by = Object.fromEntries(CHALLENGES.map((c) => [c.id, c]));
    document.getElementById("sheet").innerHTML = CHALLENGES.filter((c) => c.tiles || c.callbackFrom).map((c) => {
      const base = c.callbackFrom || c.id;
      const tiles = by[base].tiles;
      return `<section class="card"><h2>${c.id}: ${c.leadIn} ${c.target}</h2><div class="grid">${tiles.map((t, i) => {
        const f = window.CX_PHOTOS[base + ":" + i];
        const cr = byFile[f];
        return f
          ? `<figure><img src="/assets/${f}" alt=""><figcaption>${t[2]}<br><code>${cr ? cr.id.slice(0, 8) + " · " + cr.license : f}</code></figcaption></figure>`
          : `<figure class="drawn"><img src="${window.CX_TILES.tileImage(t, base + ":" + i)}" alt=""><figcaption>${t[2]}</figcaption></figure>`;
      }).join("")}</div></section>`;
    }).join("");
  });
</script>
</body>
</html>
